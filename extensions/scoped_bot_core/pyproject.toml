[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "scoped-bot-core"
version = "0.1.0"
description = "Isolated message scopes, bounded memory, delivery intents and explicit public search"
requires-python = ">=3.12"
license = {text = "GPL-3.0-or-later"}
dependencies = []

[project.optional-dependencies]
crypto = ["cryptography==50.0.2"]
image = ["Pillow==13.0.0"]
test = ["cryptography==50.0.2", "Pillow==13.0.0"]

[tool.setuptools.packages.find]
include = ["scoped_bot_core*"]

[tool.ruff]
line-length = 88
target-version = "py312"
